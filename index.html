<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GD LIVE STUDIO · GD TECH ACADEMY</title>
  <meta name="description" content="GD LIVE STUDIO — Create. Connect. Go Live. A mobile-first live streaming and recording studio by GD TECH ACADEMY.">
  <meta name="theme-color" content="#07347F">
  <meta name="application-name" content="GD LIVE STUDIO">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GD LIVE STUDIO">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://connect.facebook.net https://cdn.jsdelivr.net 'wasm-unsafe-eval'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://graph.facebook.com https://*.facebook.com https://cdn.jsdelivr.net https: wss:; img-src 'self' data: blob: https:; media-src 'self' blob:; frame-src https://accounts.google.com https://*.facebook.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/theme-boot.js"></script>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="logo-tile"><img src="assets/logo/gd-tech-academy-logo.png" alt="GD TECH ACADEMY logo" width="132" height="132"></div>
    <h1>GD LIVE STUDIO</h1>
    <p>Create. Connect. Go Live.</p>
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <noscript><div style="padding:24px;font-family:system-ui"><h1>GD LIVE STUDIO</h1><p>This application needs JavaScript. Please enable it in your browser.</p></div></noscript>

  <div id="app">
    <header class="app-header">
      <a class="brand" href="#/dashboard" aria-label="GD LIVE STUDIO home">
        <span class="logo-tile"><img src="assets/logo/gd-tech-academy-logo.png" alt="GD TECH ACADEMY" width="38" height="38"></span>
        <span><b>GD LIVE STUDIO</b><small>by GD TECH ACADEMY</small></span>
      </a>
      <span class="spacer"></span>
      <div class="header-chips">
        <span class="chip live" id="chip-live" hidden><i></i><span>LIVE</span></span>
        <span class="chip rec" id="chip-rec" hidden><i></i><span>REC</span></span>
        <span class="chip ok" id="chip-net"><i></i><span>Online</span></span>
      </div>
      <button class="btn ghost sm" id="btn-install" type="button" hidden>Install</button>
      <button class="btn ghost sm icon" id="btn-theme" type="button" aria-label="Toggle light and dark theme"></button>
      <span id="header-user"></span>
    </header>

    <div id="status-bars"></div>
    <div class="status-bar update" id="update-bar" hidden><span>A new version of GD LIVE STUDIO is ready.</span><button class="btn sm" id="update-btn" type="button">Update now</button></div>

    <div class="app-body">
      <aside class="sidebar" aria-label="Sections">
        <div class="sidebar-brand"><span class="logo-tile"><img src="assets/logo/gd-tech-academy-logo.png" alt="GD TECH ACADEMY logo" width="64" height="64"></span><div><b>GD TECH ACADEMY</b><small>Create. Connect. Go Live.</small></div></div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
      </aside>
      <main class="app-main" id="app-main" tabindex="-1"><div id="view"></div></main>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Primary"></nav>
  <footer class="app-footer" id="app-footer"></footer>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
